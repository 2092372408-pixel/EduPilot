name: Feature request
description: Suggest an improvement to the learning experience or developer workflow
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem you want to solve. A concrete learning or development workflow is more helpful than a solution alone.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "When I am learning from..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like EduPilot to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: textarea
    id: success
    attributes:
      label: How would you know this works well?
      description: Describe the expected outcome or a simple way to evaluate it.
    validations:
      required: false
