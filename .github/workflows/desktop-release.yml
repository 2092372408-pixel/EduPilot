name: Desktop packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            executable: dist/win-unpacked/EduPilot.exe
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: dist/mac/EduPilot.app/Contents/MacOS/EduPilot
          - os: macos-15
            platform: mac
            arch: arm64
            executable: dist/mac-arm64/EduPilot.app/Contents/MacOS/EduPilot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
          python -m pip install uv==0.11.15
      - name: Check source publication boundary and release identity
        run: |
          npm run check:publication
          node -e "if(process.arch!=='${{ matrix.arch }}')throw Error('Wrong runner architecture');if(process.env.GITHUB_REF_TYPE==='tag'&&process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw Error('Tag/version mismatch')"
      - name: Assemble clean backend and portable Python
        run: |
          npm run desktop:prepare
          npm run desktop:python
      - name: Build native installer
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: 5
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config desktop/builder.cjs --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged native window, recovery and data persistence
        run: node tools/check-desktop-package.js --native "${{ matrix.executable }}"
      - name: Check packaged product sources
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            node .github/check-publication.cjs --directory=dist/win-unpacked/resources/backend
          else
            APP="$(dirname "$(dirname "${{ matrix.executable }}")")"
            node .github/check-publication.cjs "--directory=$APP/Resources/backend"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: EduPilot-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*-Setup.exe
            dist/*.dmg
            dist/*-macOS-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
          pattern: EduPilot-*
      - name: Generate checksums
        working-directory: packages
        run: sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: EduPilot ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          files: packages/*
