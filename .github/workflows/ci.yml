name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check publication boundary
        run: npm run check:publication
      - name: Check data location selection and migration
        run: node tools/check-storage-location.cjs
      - name: Build Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: edupilot:ci

  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node -e "new (require('better-sqlite3'))(':memory:').close()"
      - name: Verify memory evidence and revision governance
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const os = require('node:os');
          const path = require('node:path');
          const Database = require('better-sqlite3');
          const dbPath = path.join(os.tmpdir(), 'edupilot-memory-governance-' + process.pid + '.db');
          // Simulate an existing installation using the pre-governance archival schema.
          const legacy = new Database(dbPath);
          legacy.exec(`
            CREATE TABLE archival (
              id TEXT PRIMARY KEY, scope TEXT NOT NULL, type TEXT NOT NULL, text TEXT NOT NULL,
              vec TEXT, importance REAL NOT NULL DEFAULT 0.5, hits INTEGER NOT NULL DEFAULT 0,
              source TEXT, provenance TEXT, created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL,
              invalid_at INTEGER
            );
          `);
          legacy.close();
          process.env.EDUOWL_DB = dbPath;
          process.env.EMBED_PROVIDER = 'dashscope';
          process.env.DASHSCOPE_API_KEY = '';
          const store = require('./server/store/memoryStore');
          const sessionStore = require('./server/store/sessionStore');
          const database = sessionStore.init();
          assert.ok(store.listArchival('migration-user', true));
          const columns = new Set(database.prepare('PRAGMA table_info(archival)').all().map(row => row.name));
          for (const name of ['confidence', 'status', 'version', 'supersedes_id', 'last_verified_at', 'last_hit_at']) {
            assert.ok(columns.has(name), 'Missing migrated archival column: ' + name);
          }
          (async () => {
            const sessionId = 'ci-memory-user@course-a';
            const provenance = { sessionId, turn: 1, quote: 'I prefer worked examples', messageHash: 'ci-evidence-hash' };
            const first = await store.ingestArchival(sessionId, [{
              type: 'preference', text: 'Prefers worked examples', provenance,
            }], { scopeMode: 'uid' });
            assert.equal(first.added, 1);
            let active = store.listArchival('ci-memory-user');
            assert.equal(active.length, 1);
            const original = active[0];
            assert.equal(original.confidence, 0.82);
            assert.equal(original.status, 'active');
            assert.equal(original.version, 1);
            assert.equal(store.verifyArchival(original.id, 'ci-memory-user'), true);
            assert.equal(store.listArchival('ci-memory-user')[0].status, 'verified');
            assert.ok(store.memoryHistory(original.id).some(item => item.action === 'verified'));

            const updater = { callApi: async () => JSON.stringify({ action: 'UPDATE', targetIndex: 1, importance: 0.9 }) };
            const updated = await store.ingestArchival(sessionId, [{
              type: 'preference', text: 'Prefers concise worked examples',
              provenance: { ...provenance, turn: 2, quote: 'I prefer concise worked examples' },
            }], { scopeMode: 'uid', llm: updater });
            assert.equal(updated.updated, 1);
            active = store.listArchival('ci-memory-user');
            assert.equal(active.length, 1);
            assert.equal(active[0].version, 2);
            assert.equal(active[0].supersedesId, original.id);
            assert.ok(store.memoryHistory(original.id).some(item => item.action === 'superseded'));

            const deleter = { callApi: async () => JSON.stringify({ action: 'DELETE', targetIndex: 1 }) };
            const deleted = await store.ingestArchival(sessionId, [{
              type: 'preference', text: 'No longer prefers concise worked examples',
              provenance: { ...provenance, turn: 3, quote: 'No longer prefer concise worked examples' },
            }], { scopeMode: 'uid', llm: deleter });
            assert.equal(deleted.invalidated, 1);
            assert.equal(store.listArchival('ci-memory-user').length, 0, 'DELETE must not insert replacement memory');
            database.close();
            console.log('Memory schema migration, evidence confidence, explicit verification, versioning and DELETE semantics passed');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Check publication boundary
        run: npm run check:publication
      - name: Verify Dreaming event queue and evidence gates
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const os = require('node:os');
          const path = require('node:path');
          process.env.EDUOWL_DB = path.join(os.tmpdir(), 'edupilot-dreaming-' + process.pid + '.db');
          process.env.EMBED_PROVIDER = 'dashscope';
          process.env.DASHSCOPE_API_KEY = '';
          const store = require('./server/store/memoryStore');
          const sessionStore = require('./server/store/sessionStore');
          const { validatePattern } = require('./server/agent/dreaming');
          const database = sessionStore.init();
          const sessions = ['dream-ci@course-a~session-a', 'dream-ci@course-a~session-b'];
          for (let i = 0; i < 5; i++) {
            const sessionId = sessions[i % 2];
            const correct = i === 3;
            assert.equal(store.appendLearningEvent(
              sessionId, i + 1, 'answer-' + i,
              correct ? 'answer_correct' : 'answer_incorrect',
              'kp-recursion',
              { question: 'Recursion termination question ' + i, userAnswer: 'B' }
            ), true);
          }
          const jobId = store.enqueueDreaming(sessions[0]);
          assert.ok(jobId, 'Five verified quiz events should enqueue Dreaming');
          const job = store.claimDreamingJob();
          assert.equal(job.id, jobId);
          const batch = store.getDreamingBatch(job);
          assert.equal(batch.events.length, 5);
          const candidate = validatePattern({
            kpId: 'kp-recursion', kind: 'persistent_difficulty',
            description: 'Repeated errors on recursion termination conditions',
            eventIds: [1, 2, 3, 5],
          }, batch.events);
          assert.ok(candidate, 'Repeated errors across sessions should pass evidence gates');
          assert.equal(candidate.type, 'pain');
          assert.ok(candidate.confidence >= 0.7 && candidate.confidence <= 0.92);
          assert.equal(validatePattern({
            kpId: 'kp-recursion', kind: 'persistent_difficulty',
            description: 'Unsupported single-session pattern', eventIds: [1, 3, 5],
          }, batch.events), null);
          assert.equal(store.completeDreamingJob(job, batch, { summary: 'CI reflection', patterns: [] }, 0), true);
          assert.equal(store.dreamingStats('dream-ci').runs, 1);
          assert.equal(store.dreamingStats('dream-ci').queued, 0);
          database.close();
          console.log('Learning event persistence, Dreaming queue, evidence validation and checkpoint passed');
          NODE
      - name: Verify SQLite and desktop startup
        shell: bash
        run: |
          node <<'NODE'
          const { spawn } = require('node:child_process');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const Database = require('better-sqlite3');
          const db = new Database(':memory:');
          db.close();
          const app = spawn(process.execPath, ['server/index.js'], {
            stdio: 'inherit',
            env: { ...process.env, HOST: '127.0.0.1', PORT: '8787', LLM_MODE: 'mock',
              EDUOWL_DB: path.join(process.env.RUNNER_TEMP, 'desktop-smoke.db'),
              EDUOWL_ENV_FILE: path.join(process.env.RUNNER_TEMP, 'desktop-smoke.env'),
              LLM_PROVIDER: 'openai', LLM_BASE_URL: 'https://api.openai.com/v1', LLM_MODEL: 'gpt-4.1',
              LLM_API_KEY: '', TAVILY_API_KEY: '', EDUOWL_WEB_ENABLED: '0' },
          });
          (async () => {
            try {
              let ready = false;
              for (let i = 0; i < 45; i++) {
                if (app.exitCode !== null) throw new Error('Server exited before becoming ready');
                try { ready = (await fetch('http://127.0.0.1:8787/api/health')).ok; } catch (_) {}
                if (ready) break;
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
              if (!ready) throw new Error('Desktop startup timed out');
              const html = await (await fetch('http://127.0.0.1:8787/')).text();
              if (!html.includes('llmSettingsSummary') || !html.includes('webToggle')) throw new Error('Model settings or search switch is missing');
              const getConfig = async route => {
                const result = await fetch('http://127.0.0.1:8787' + route);
                assert.equal(result.status, 200);
                return (await result.json()).config;
              };
              const save = body => fetch('http://127.0.0.1:8787/api/llm/save', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
              });
              assert.equal((await getConfig('/api/llm/config')).configured, false);
              let web = await getConfig('/api/web/config');
              assert.equal(web.supported, true);
              assert.equal(web.enabled, false);
              assert.equal(web.hasKey, false);
              for (const apiKey of [undefined, '']) {
                const result = await save({ provider: 'openai', model: 'gpt-4.1', apiKey });
                assert.equal(result.status, 400, 'Missing model key was accepted');
              }
              const testKey = 'ci-placeholder-key';
              const saved = await save({ provider: 'openai', model: 'gpt-4.1', apiKey: testKey });
              assert.equal(saved.status, 200);
              assert.equal((await getConfig('/api/llm/config')).configured, true);
              assert.ok(!JSON.stringify(await getConfig('/api/llm/config')).includes(testKey), 'Model key was exposed');
              web = await getConfig('/api/web/config');
              assert.equal(web.provider, 'openai');
              assert.equal(web.model, 'gpt-4.1');
              assert.equal(web.protocol, 'responses');
              assert.equal(web.enabled, true);
              assert.equal(web.hasKey, true);
              assert.ok(!JSON.stringify(web).includes(testKey), 'Search key was exposed');
              const removedSave = await fetch('http://127.0.0.1:8787/api/web/config', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: true }),
              });
              assert.equal(removedSave.status, 404, 'Search configuration must remain read-only');
              assert.equal((await save({ provider: 'openai', model: 'gpt-4o' })).status, 200);
              assert.equal((await getConfig('/api/web/config')).supported, false);
              console.log('SQLite, startup, model key validation and native search configuration passed');
            } finally { app.kill(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Check macOS launchers
        if: runner.os == 'macOS'
        run: |
          bash -n install.command start.command stop.command
          test -x install.command && test -x start.command && test -x stop.command
