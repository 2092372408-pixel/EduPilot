name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check publication boundary
        run: npm run check:publication
      - name: Build Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: edupilot:ci

  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node -e "new (require('better-sqlite3'))(':memory:').close()"
      - name: Check publication boundary
        run: npm run check:publication
      - name: Verify SQLite and desktop startup
        shell: bash
        run: |
          node <<'NODE'
          const { spawn } = require('node:child_process');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const Database = require('better-sqlite3');
          const db = new Database(':memory:');
          db.close();
          const app = spawn(process.execPath, ['server/index.js'], {
            stdio: 'inherit',
            env: { ...process.env, HOST: '127.0.0.1', PORT: '8787', LLM_MODE: 'mock',
              EDUOWL_DB: path.join(process.env.RUNNER_TEMP, 'desktop-smoke.db'),
              EDUOWL_ENV_FILE: path.join(process.env.RUNNER_TEMP, 'desktop-smoke.env'),
              LLM_PROVIDER: 'openai', LLM_BASE_URL: 'https://api.openai.com/v1', LLM_MODEL: 'gpt-4.1',
              LLM_API_KEY: '', TAVILY_API_KEY: '', EDUOWL_WEB_ENABLED: '0' },
          });
          (async () => {
            try {
              let ready = false;
              for (let i = 0; i < 45; i++) {
                if (app.exitCode !== null) throw new Error('Server exited before becoming ready');
                try { ready = (await fetch('http://127.0.0.1:8787/api/health')).ok; } catch (_) {}
                if (ready) break;
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
              if (!ready) throw new Error('Desktop startup timed out');
              const html = await (await fetch('http://127.0.0.1:8787/')).text();
              if (!html.includes('llmSettingsSummary') || !html.includes('webToggle')) throw new Error('Model settings or search switch is missing');
              const getConfig = async route => {
                const result = await fetch('http://127.0.0.1:8787' + route);
                assert.equal(result.status, 200);
                return (await result.json()).config;
              };
              const save = body => fetch('http://127.0.0.1:8787/api/llm/save', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
              });
              assert.equal((await getConfig('/api/llm/config')).configured, false);
              let web = await getConfig('/api/web/config');
              assert.equal(web.supported, true);
              assert.equal(web.enabled, false);
              assert.equal(web.hasKey, false);
              for (const apiKey of [undefined, '']) {
                const result = await save({ provider: 'openai', model: 'gpt-4.1', apiKey });
                assert.equal(result.status, 400, 'Missing model key was accepted');
              }
              const testKey = 'ci-placeholder-key';
              const saved = await save({ provider: 'openai', model: 'gpt-4.1', apiKey: testKey });
              assert.equal(saved.status, 200);
              assert.equal((await getConfig('/api/llm/config')).configured, true);
              assert.ok(!JSON.stringify(await getConfig('/api/llm/config')).includes(testKey), 'Model key was exposed');
              web = await getConfig('/api/web/config');
              assert.equal(web.provider, 'openai');
              assert.equal(web.model, 'gpt-4.1');
              assert.equal(web.protocol, 'responses');
              assert.equal(web.enabled, true);
              assert.equal(web.hasKey, true);
              assert.ok(!JSON.stringify(web).includes(testKey), 'Search key was exposed');
              const removedSave = await fetch('http://127.0.0.1:8787/api/web/config', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: true }),
              });
              assert.equal(removedSave.status, 404, 'Search configuration must remain read-only');
              assert.equal((await save({ provider: 'openai', model: 'gpt-4o' })).status, 200);
              assert.equal((await getConfig('/api/web/config')).supported, false);
              console.log('SQLite, startup, model key validation and native search configuration passed');
            } finally { app.kill(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Check macOS launchers
        if: runner.os == 'macOS'
        run: |
          bash -n install.command start.command stop.command
          test -x install.command && test -x start.command && test -x stop.command
